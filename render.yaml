services:
  - type: web
    name: job-applier-ai
    env: node
    region: oregon
    plan: free
    buildCommand: >-
      npm install &&
      npx playwright install-deps chromium || true &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/playwright-browsers
      npx playwright install chromium &&
      echo "=== Browser install done ===" &&
      ls /opt/render/project/src/playwright-browsers
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HEADLESS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
