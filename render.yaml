services:
  - type: web
    name: job-applier-ai
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --ignore-scripts && npx playwright install chromium && cp -r /opt/render/.cache/ms-playwright /opt/render/project/src/playwright-browsers && echo "=== Browser copied to project dir ===" && ls /opt/render/project/src/playwright-browsers
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HEADLESS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
